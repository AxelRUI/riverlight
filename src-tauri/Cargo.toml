[package]
name = "dota-plus-local"
version = "0.1.0"
description = "Overlay local tipo Dota Plus alimentado por Game State Integration"
authors = []
license = "MIT"
edition = "2024"

[lib]
# Sufijo _lib necesario en Windows: https://github.com/rust-lang/cargo/issues/8519
name = "dota_plus_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"
tiny_http = "0.12"
tauri-plugin-global-shortcut = "2"
ureq = { version = "2", features = ["json"] }
# Arrancar con Windows en reposo y no abrir dos copias (pelearían por el puerto de GSI).
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# Ya viene en el árbol de Tauri; para leer teclas/botones y detectar la ventana de Dota.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
